[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lianzz-downloader"
version = "1.1.0"
description = "A fast, multi-threaded, segmented file downloader powered by HTTP Range."
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "steph" },
]
keywords = ["downloader", "http", "range", "multi-thread", "segmented", "aria2", "axel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.25",
]

[project.urls]
Homepage = "https://github.com/lianzhongzhe/lianzz-downloader"
Issues = "https://github.com/lianzhongzhe/lianzz-downloader/issues"

[project.scripts]
fastdownloader = "fastdownloader.cli:main"
fastdownloader-gui = "fastdownloader.gui:main"

[tool.setuptools]
packages = ["fastdownloader"]
include-package-data = true

[tool.setuptools.package-data]
fastdownloader = ["py.typed"]